<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用量看板</title>
<style>
  html,body{margin:0}
  @keyframes ucbLive{0%,100%{opacity:1}50%{opacity:.35}}
  .ucb-menu-item:hover{background:rgba(30,28,24,.06)!important;}

  /* ===== 菜单栏 app 视图开关(由 ?view= 切;默认=设计原型,浏览器预览用) ===== */
  /* 弹窗模式:内容按窗口宽铺满(border-box),圆角/边框交给原生 NSPopover,网页不画 */
  body.view-popover #page{ padding:0!important; min-height:0!important; gap:0!important; background:transparent!important; }
  body.view-popover #fullWindow{ display:none!important; }
  body.view-popover #mbWrap{ width:100%!important; max-width:none!important; }
  body.view-popover #mbPill, body.view-popover #mbCaret{ display:none!important; }
  body.view-popover #mbPop{ position:static!important; display:block!important; right:auto!important; top:auto!important; width:100%!important; box-sizing:border-box!important; border:0!important; border-radius:0!important; box-shadow:none!important; }
  /* 完整窗口模式:只留仪表盘 */
  body.view-full #mbWrap{ display:none!important; }
</style>
</head>
<body>
<script>
/* 菜单栏 app 视图开关 + JS→原生桥(独立于下方数据/图表逻辑,浏览器里是无害 no-op) */
(function(){
  var v = new URLSearchParams(location.search).get('view');
  if (v === 'popover' || v === 'full') document.body.classList.add('view-' + v);

  window.__appAction = function(name, data){
    try {
      if (window.webkit && webkit.messageHandlers && webkit.messageHandlers.app)
        webkit.messageHandlers.app.postMessage(Object.assign({ action: name }, data || {}));
    } catch (e) {}
  };

  document.addEventListener('DOMContentLoaded', function(){
    var ob = document.getElementById('mbOpen');
    if (ob) ob.addEventListener('click', function(){ window.__appAction('openFull'); });
    var qb = document.getElementById('mbQuit');
    if (qb) qb.addEventListener('click', function(){ window.__appAction('quit'); });
  });

  // 弹窗模式:把内容真实高度报给原生,让 NSPopover 自适配(不裁切/不留白)
  if (v === 'popover') {
    var lastH = 0;
    setInterval(function(){
      var el = document.getElementById('mbPop');
      if (!el) return;
      var r = el.getBoundingClientRect(), h = Math.ceil(r.height), w = Math.ceil(r.width);
      if (h && Math.abs(h - lastH) > 1) { lastH = h; window.__appAction('resize', { h: h, w: w }); }
    }, 600);
  }
})();
</script>

<div id="page" style="min-height:100vh; box-sizing:border-box; background:radial-gradient(900px 480px at 84% -14%, rgba(217,119,87,.07), transparent 58%), #EBE9E4; color:#1E1C18; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; -webkit-font-smoothing:antialiased; line-height:1.45; padding:30px 18px 64px; display:flex; flex-direction:column; align-items:center; gap:18px;">

      <span style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:12px;"><span style="color:#ABA59C;">5h</span> <span id="pill5h" style="color:#1E1C18;">—</span></span>
      <span style="width:1px; height:13px; background:rgba(30,28,24,.13);"></span>

        <span style="font-weight:600; font-size:13px; letter-spacing:.01em;">用量<span style="color:#C2603E;">看板</span></span>

      <div style="display:flex; align-items:center; justify-content:space-between; padding:0 9px 9px;">

<script>
document.addEventListener("DOMContentLoaded", async function(){
  var R = document;
  var MONO = "'JetBrains Mono',ui-monospace,Menlo,monospace";
  var $ = function(id){ return R.querySelector('#'+id); };

  // ---- 取真实数据 ----
  var data;
  try {
    var resp = await fetch('/api/usage.json', { cache: 'no-store' });
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    data = await resp.json();
  } catch(e){
    $("heroBig").textContent = "—";
    $("heroSub").innerHTML = '<span style="color:#BE4A33">读取数据失败:'+ (e && e.message) +'。请用 <b>node engine/usage-data.mjs --serve</b> 启动后访问。</span>';
    return;
  }

  // ---- 模型 → 颜色(设计配色 + 兜底)----
  var PALETTE = {
    "opus-4-8":   { color:"#D97757", top:"#E89571" },
    "opus-4-7":   { color:"#D9A441", top:"#E8BC63" },
    "sonnet-4-6": { color:"#7C8FA3", top:"#9AABBC" }
  };
  var FALLBACK = [
    { color:"#A98AD1", top:"#C0A6E0" },
    { color:"#6FA88C", top:"#8DBFA8" },
    { color:"#C77DA0", top:"#D898B8" },
    { color:"#C98A5E", top:"#DBA47C" }
  ];
  // 状态先声明(rebuildModels 要用 st.on)
  var st = { view:"bar", metric:"tok", period:"month", tool:"all", on:{} };

  // 模型 → 工具 + 配色,封成可重建函数:60s 刷新时新出现的模型也能进来,且保留已有显隐选择
  var toolOf = {};
  var MODELS = [];
  function rebuildModels(){
    toolOf = {};
    (data.daily || []).forEach(function(d){ for(var m in d.byModel){ toolOf[m] = d.byModel[m].tool; } });
    // 兜底色:非设计配色的模型按 id 字母序分配【不同】的 FALLBACK 色 —— 确定性(不随 tok 排序漂移)且互不撞色
    var fbMap = {}, fbIds = (data.models || []).filter(function(id){ return !PALETTE[id]; }).sort();
    fbIds.forEach(function(id, i){ fbMap[id] = FALLBACK[i % FALLBACK.length]; });
    MODELS = (data.models || []).map(function(id){
      var p = PALETTE[id] || fbMap[id];
      return { id:id, color:p.color, top:p.top, tool: toolOf[id] || "claude-code" };
    });
    MODELS.forEach(function(m){ if(st.on[m.id]===undefined) st.on[m.id]=true; }); // 新模型默认显示,不动已有选择
  }
  rebuildModels();

  // ---- 日序列:date → label "MM/DD";引擎已补齐连续天与各模型键 ----
  var days = (data.daily || []).map(function(d){
    return { label: d.date.slice(5).replace("-","/"), date: d.date, byModel: d.byModel || {} };
  });

  var ZB = { input:0, output:0, cacheWrite:0, cacheRead:0 };
  function cell(d, mid){ var e = d.byModel[mid]; return e ? e : { tok:0, usd:0, tokBreakdown:ZB, usdBreakdown:ZB }; }

  // 当前工具筛选下可见的模型
  function viz(){ return st.tool==="all" ? MODELS : MODELS.filter(function(m){ return m.tool===st.tool; }); }

  function fmtUSD(v){ if(v>=1000) return "$"+(v/1000).toFixed(1)+"k"; return "$"+(v<10?v.toFixed(1):Math.round(v)); }
  function fmtUSDbig(v){ return v.toLocaleString("en-US",{maximumFractionDigits:0}); }

    var h=ms/3600000;
    if(h<24){ var hh=Math.floor(h), mm=Math.round((h-hh)*60); return "还剩 "+(hh>0?hh+"h ":"")+mm+"m 重置"; }
    return "还剩 "+Math.round(h/24)+" 天 重置";

  // 完整窗口的限额卡:跟着工具分页(全部 → 列出每个工具的 5h/7d)。pct 是「已用%」。
  function limitCard(toolName, winLabel, entry, color, grad, asOf){
    var has = entry && entry.pct!=null;
    var lc = limitColor(has ? entry.pct : null);
    var pct = has? entry.pct+"%" : "—";
    var snap = (has && asOf) ? ' · 截至 '+clockHM(asOf) : '';
    var foot = has ? ((entry.resetAt? fmtRemain(entry.resetAt) : "已接入")+snap)
                   : (toolName==="codex" ? "未接入" : "未接入 · 需装 ClaudeMeter");
    var tag = (data.tools&&data.tools.length>1) ? '<span style="font-size:10px; color:#ABA59C; margin-left:6px;">'+toolLabel(toolName)+'</span>' : '';
    return '<div style="background:#FBFAF8; border:1px solid rgba(30,28,24,.08); border-radius:12px; padding:14px 16px;">'
      +'<div style="display:flex; align-items:baseline; justify-content:space-between;"><span style="font-size:12.5px; color:#847F76;">'+winLabel+tag+'</span>'
      +'<span style="font-family:'+MONO+'; font-weight:600; font-size:29px; line-height:1; color:'+(has?lc.text:"#ABA59C")+';">'+pct+(has?'<span style="font-size:11px; font-weight:500; color:#ABA59C; margin-left:3px;">已用</span>':'')+'</span></div>'
      +'<div style="height:8px; border-radius:6px; background:#ECEAE5; margin:12px 0 9px; overflow:hidden;"><i style="display:block; height:100%; width:'+(has?Math.min(100,entry.pct):0)+'%; border-radius:6px; background:'+(has?lc.bar:"#D8D3CB")+';"></i></div>'
      +'<div style="font-family:'+MONO+'; font-size:11.5px; color:#ABA59C;">'+foot+'</div></div>';
  }
  function renderLimitCards(){
    var L=data.limits||{}, tools = st.tool==="all" ? (data.tools||[]) : [st.tool], html="";
    tools.forEach(function(t){
      var lim=L[t]||{};
      html+=limitCard(t,"5 小时窗口", lim.fiveHour, "#D97757", "linear-gradient(90deg,#E08B6B,#D97757)", lim.asOf);
      html+=limitCard(t,"7 天额度", lim.sevenDay, "#BE4A33", "linear-gradient(90deg,#CA5C3E,#BE4A33)", lim.asOf);
    });
    $("limitsGrid").innerHTML=html;
  }

  function applyUpdatedAt(iso){
    var d=new Date(iso); var hhmm = isNaN(d) ? "—" : (('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2));
    $("updMain").textContent="更新于 "+hhmm+" · 每 60s";
    $("updPop").textContent="更新 "+hhmm;
  }

  // ---- 初始化 ----
  setActive($("periods"), $("periods").querySelector('[data-p="month"]'));
  setActive($("metricSeg"), $("metricSeg").querySelector('[data-m="tok"]'));
  setActive($("viewSeg"), $("viewSeg").querySelector('[data-v="bar"]'));

  renderPillPop();
  applyUpdatedAt(data.updatedAt);
  $("notice").textContent = data.notice || "";

  renderToolTabs();
  renderMini();
  renderAll();

  // ---- 每 60s 静默刷新数据(与引擎重算节奏一致)----
  setInterval(async function(){
    try{
      var r = await fetch('/api/usage.json',{cache:'no-store'}); if(!r.ok) return;
      var nd = await r.json();
      data = nd;
      days = (nd.daily||[]).map(function(d){ return { label:d.date.slice(5).replace("-","/"), date:d.date, byModel:d.byModel||{} }; });
      rebuildModels(); // 新模型 / tool 变化也跟上,保留显隐选择
      renderPillPop(); applyUpdatedAt(nd.updatedAt); $("notice").textContent=nd.notice||"";
      renderToolTabs(); renderMini(); renderAll();
    }catch(e){}
  }, 60000);
});
</script>
</body>
</html>
