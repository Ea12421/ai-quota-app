<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用量看板</title>
<style>
  html,body{margin:0}
  @keyframes ucbLive{0%,100%{opacity:1}50%{opacity:.35}}
  .ucb-menu-item:hover{background:rgba(30,28,24,.06)!important;}
  .ucb-section-toggle{min-height:36px; box-sizing:border-box; margin:20px 0 10px!important; padding:6px 0; cursor:pointer; user-select:none; transition:color .14s;}
  .ucb-section-toggle:focus-visible{outline:2px solid rgba(217,119,87,.45); outline-offset:3px; border-radius:8px;}
  .ucb-section-toggle.is-collapsed{margin:10px 0 0!important;}
  .ucb-section-toggle .ucb-section-title-cn{font-size:12px; color:#625D55; letter-spacing:0;}
  .ucb-section-toggle .ucb-section-title-en{display:none;}
  .ucb-section-toggle>span[style*="flex:1"]{min-width:18px;}
  .ucb-section-btn{position:relative; height:28px; width:28px; min-width:28px; margin-left:0; border:0; border-radius:7px; background:transparent; color:#ABA59C; cursor:pointer; padding:0;}
  .ucb-section-btn::before{content:""; position:absolute; left:10px; top:9px; width:7px; height:7px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; transform:rotate(-45deg); transition:transform .16s ease,color .14s;}
  .ucb-section-toggle.is-expanded .ucb-section-btn::before{transform:rotate(45deg); top:8px;}
  .ucb-section-toggle:hover .ucb-section-btn{background:rgba(30,28,24,.055); color:#1E1C18;}
  .ucb-project-picker{position:relative; flex:1 1 300px; max-width:520px;}
  .ucb-project-input{width:100%; height:34px; box-sizing:border-box; border-radius:9px; border:1px solid rgba(30,28,24,.1); background:#FBFAF8; color:#1E1C18; font:inherit; font-size:12.5px; padding:0 32px 0 10px; outline:none;}
  .ucb-project-input:focus{border-color:rgba(217,119,87,.42); box-shadow:0 0 0 3px rgba(217,119,87,.1);}
  .ucb-project-caret{position:absolute; right:10px; top:8px; color:#ABA59C; font-size:12px; pointer-events:none;}
  .ucb-project-menu{display:none; position:absolute; z-index:50; left:0; right:0; top:39px; max-height:280px; overflow:auto; border-radius:11px; border:1px solid rgba(30,28,24,.13); background:#FFFFFF; box-shadow:0 18px 40px -18px rgba(30,28,24,.36), 0 4px 12px -8px rgba(30,28,24,.18); padding:6px;}
  .ucb-project-menu.is-open{display:block;}
  .ucb-project-option{width:100%; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; text-align:left; border:0; background:transparent; color:#1E1C18; border-radius:8px; padding:8px 9px; font:inherit; cursor:pointer;}
  .ucb-project-option:hover,.ucb-project-option.is-active{background:#F5F2ED;}
  .ucb-project-option b{font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ucb-project-option span{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:10.5px; color:#ABA59C; white-space:nowrap;}
  .ucb-project-group{font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:#ABA59C; padding:7px 9px 4px;}
  .ucb-section-title-cn{font-size:11px; font-weight:700; letter-spacing:.04em; color:#ABA59C;}
  .ucb-section-title-en{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:10px; color:#C9C3BA; margin-left:3px;}
  .ucb-decision-card{background:#FBFAF8; border:1px solid rgba(30,28,24,.08); border-radius:12px; padding:12px 13px; min-height:96px; box-sizing:border-box;}
  .ucb-decision-head{display:flex; align-items:baseline; gap:7px; margin-bottom:7px;}
  .ucb-decision-title{font-size:12px; font-weight:700; color:#847F76;}
  .ucb-decision-kicker{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:9.5px; color:#C9C3BA;}
  .ucb-decision-value{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-weight:600; font-size:21px; line-height:1.12;}
  .ucb-decision-meta{font-size:11.5px; color:#847F76; margin-top:7px;}
  .ucb-decision-card[data-project]{cursor:pointer;}
  .ucb-decision-card[data-project]:hover{border-color:rgba(30,28,24,.16); box-shadow:0 6px 18px -14px rgba(30,28,24,.45);}
  .ucb-decision-card[data-project]:focus-visible{outline:2px solid rgba(217,119,87,.4); outline-offset:3px;}
  .ucb-range-controls{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;}
  .ucb-range-select{height:36px; min-width:142px; box-sizing:border-box; border:1px solid rgba(30,28,24,.08); border-radius:9px; background:#ECEAE5; color:#1E1C18; padding:0 31px 0 11px; font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; outline:none;}
  .ucb-range-select:focus{border-color:rgba(217,119,87,.42); box-shadow:0 0 0 3px rgba(217,119,87,.09);}
  .ucb-timezone-label{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:10.5px; color:#ABA59C; white-space:nowrap;}
  .ucb-custom-period{display:none; align-items:center; gap:7px; padding:7px 8px; border:1px solid rgba(30,28,24,.07); border-radius:9px; background:#F7F5F1;}
  .ucb-custom-period.is-visible{display:flex;}
  .ucb-custom-date{height:30px; width:126px; box-sizing:border-box; border:1px solid rgba(30,28,24,.09); border-radius:7px; background:#FFFFFF; color:#1E1C18; padding:0 7px; font:inherit; font-size:11px; outline:none;}
  .ucb-custom-date:focus{border-color:rgba(217,119,87,.42); box-shadow:0 0 0 3px rgba(217,119,87,.08);}
  .ucb-custom-separator{font-size:11px; color:#ABA59C;}
  @media (max-width:520px){
    .ucb-project-picker{flex-basis:100%; max-width:none;}
    .ucb-decision-card{min-height:0; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:5px 10px; align-items:center; padding:11px 12px;}
    .ucb-decision-head{margin:0; grid-column:1/2;}
    .ucb-decision-value{grid-column:2/3; grid-row:1/2; text-align:right; font-size:18px; max-width:112px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    .ucb-decision-card .ucb-decision-bar{display:none;}
    .ucb-decision-meta{grid-column:1/-1; margin-top:2px;}
    .ucb-range-controls{justify-content:stretch; width:100%;}
    .ucb-range-select{flex:1; min-width:0;}
    .ucb-timezone-label{width:100%; white-space:normal;}
    .ucb-custom-period{width:100%; box-sizing:border-box;}
    .ucb-custom-date{flex:1; min-width:0;}
  }

  /* ===== 菜单栏 app 视图开关(由 ?view= 切;默认=设计原型,浏览器预览用) ===== */
  /* 弹窗模式:内容按窗口宽铺满(border-box),圆角/边框交给原生 NSPopover,网页不画 */
  body.view-popover #page{ padding:0!important; min-height:0!important; gap:0!important; background:transparent!important; }
  body.view-popover #fullWindow{ display:none!important; }
  body.view-popover #mbWrap{ width:100%!important; max-width:none!important; }
  body.view-popover #mbPill, body.view-popover #mbCaret{ display:none!important; }
  body.view-popover #mbPop{ position:static!important; display:block!important; right:auto!important; top:auto!important; width:100%!important; box-sizing:border-box!important; border:0!important; border-radius:0!important; box-shadow:none!important; }
  /* 完整窗口模式:只留仪表盘 */
  body.view-full #mbWrap{ display:none!important; }
  body.view-full #page{ padding:0!important; min-height:100vh!important; gap:0!important; align-items:stretch!important; background:#FFFFFF!important; }
  body.view-full #fullWindow{ max-width:none!important; min-height:100vh!important; border:0!important; border-radius:0!important; box-shadow:none!important; overflow:visible!important; }
  body.view-full .ucb-faux-titlebar{ display:none!important; }
  body.view-full .ucb-full-content{ padding:22px 24px 30px!important; }
</style>
</head>
<body>
<script>
/* 菜单栏 app 视图开关 + JS→原生桥(独立于下方数据/图表逻辑,浏览器里是无害 no-op) */
(function(){
  var v = new URLSearchParams(location.search).get('view');
  if (v === 'popover' || v === 'full') document.body.classList.add('view-' + v);

  window.__appAction = function(name, data){
    try {
      if (window.webkit && webkit.messageHandlers && webkit.messageHandlers.app)
        webkit.messageHandlers.app.postMessage(Object.assign({ action: name }, data || {}));
    } catch (e) {
      console.warn("app action bridge failed", e);
    }
  };

  document.addEventListener('DOMContentLoaded', function(){
    var ob = document.getElementById('mbOpen');
    if (ob) ob.addEventListener('click', function(){ window.__appAction('openFull'); });
    var qb = document.getElementById('mbQuit');
    if (qb) qb.addEventListener('click', function(){ window.__appAction('quit'); });
  });

  // 弹窗模式:把内容真实高度报给原生,让 NSPopover 自适配(不裁切/不留白)
  if (v === 'popover') {
    var lastH = 0;
    setInterval(function(){
      var el = document.getElementById('mbPop');
      if (!el) return;
      var r = el.getBoundingClientRect(), h = Math.ceil(r.height), w = Math.ceil(r.width);
      if (h && Math.abs(h - lastH) > 1) { lastH = h; window.__appAction('resize', { h: h, w: w }); }
    }, 600);
  }
})();
</script>

<div id="page" style="min-height:100vh; box-sizing:border-box; background:radial-gradient(900px 480px at 84% -14%, rgba(217,119,87,.07), transparent 58%), #EBE9E4; color:#1E1C18; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; -webkit-font-smoothing:antialiased; line-height:1.45; padding:30px 18px 64px; display:flex; flex-direction:column; align-items:center; gap:18px;">

  <!-- ===== 菜单栏小窗 + 快捷弹窗 ===== -->
  <div id="mbWrap" style="position:relative; width:100%; max-width:780px;">
    <div id="mbPill" style="height:33px; border-radius:9px; background:rgba(255,255,255,.82); -webkit-backdrop-filter:blur(18px) saturate(1.3); backdrop-filter:blur(18px) saturate(1.3); border:1px solid rgba(30,28,24,.1); box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 4px 14px -6px rgba(30,28,24,.22); display:flex; align-items:center; gap:12px; padding:0 13px; font-size:12.5px; color:#847F76; cursor:pointer; user-select:none;">
      <span style="width:7px; height:7px; border-radius:50%; background:#D97757; box-shadow:0 0 7px rgba(217,119,87,.55); animation:ucbLive 2.4s ease-in-out infinite;"></span>
      <span style="font-size:11px; color:#ABA59C; letter-spacing:.03em; margin-right:auto;">常驻菜单栏 · 点开 ↕</span>
      <span style="opacity:.55; font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:11px; letter-spacing:.04em;">⌘ ⌥</span>
      <span style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:12px;"><span style="color:#ABA59C;">5h</span> <span id="pill5h" style="color:#1E1C18;">—</span></span>
      <span style="width:1px; height:13px; background:rgba(30,28,24,.13);"></span>
      <span style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:12px;"><span style="color:#ABA59C;">7d</span> <span id="pill7d" style="color:#C2603E;">—</span></span>
      <span id="mbCaret" style="color:#ABA59C; font-size:11px; margin-left:1px; transition:transform .18s;">⌄</span>
    </div>

    <!-- 快捷弹窗 -->
    <div id="mbPop" style="position:absolute; top:calc(100% + 8px); right:0; width:288px; z-index:30; display:none; border-radius:13px; background:rgba(252,251,249,.92); -webkit-backdrop-filter:blur(40px) saturate(1.5); backdrop-filter:blur(40px) saturate(1.5); border:0.5px solid rgba(30,28,24,.13); box-shadow:inset 0 0.5px 0 rgba(255,255,255,.9), 0 18px 46px -10px rgba(30,28,24,.32), 0 3px 10px -4px rgba(30,28,24,.18); padding:7px; transform-origin:top right; color:#1E1C18;">

      <div style="display:flex; align-items:center; justify-content:space-between; padding:6px 9px 11px;">
        <span style="font-weight:600; font-size:13px; letter-spacing:.01em;">用量<span style="color:#C2603E;">看板</span></span>
        <span id="updPop" style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:10.5px; color:#ABA59C;">更新 —</span>
      </div>
      <div id="mbSource" style="padding:0 9px 9px; margin-top:-5px; font-size:10.5px; line-height:1.35; color:#ABA59C;">本机日志 Token · 非 Profile / 额度口径</div>

      <div style="display:flex; align-items:center; justify-content:space-between; padding:0 9px 9px;">
        <span style="font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:#ABA59C;">实时限额</span>
        <span style="color:#CBC5BB; font-size:12px;">›</span>
      </div>

      <div style="padding:0 9px 12px;">
        <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:7px;">
          <span style="font-size:12.5px; color:#1E1C18;">5 小时额度</span>
          <span style="display:flex; align-items:baseline; gap:9px;"><span id="pop5hReset" style="font-size:11px; color:#ABA59C;">未接入</span><span id="pop5hPct" style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-weight:600; font-size:12.5px; color:#1E1C18;">—</span></span>
        </div>
        <div style="height:5px; border-radius:4px; background:#ECEAE5; overflow:hidden;"><i id="pop5hBar" style="display:block; height:100%; width:0%; border-radius:4px; background:linear-gradient(90deg,#E08B6B,#D97757);"></i></div>
      </div>
      <div style="padding:0 9px 13px;">
        <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:7px;">
          <span style="font-size:12.5px; color:#1E1C18;">7 天额度</span>
          <span style="display:flex; align-items:baseline; gap:9px;"><span id="pop7dReset" style="font-size:11px; color:#ABA59C;">未接入</span><span id="pop7dPct" style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-weight:600; font-size:12.5px; color:#C2603E;">—</span></span>
        </div>
        <div style="height:5px; border-radius:4px; background:#ECEAE5; overflow:hidden;"><i id="pop7dBar" style="display:block; height:100%; width:0%; border-radius:4px; background:linear-gradient(90deg,#CA5C3E,#BE4A33);"></i></div>
      </div>

      <div id="mbForecast" style="margin:0 9px 12px; border-radius:9px; background:#F5F2ED; border:1px solid rgba(30,28,24,.07); padding:8px 9px; font-size:11.5px; color:#847F76;"></div>

      <div style="height:0.5px; background:rgba(30,28,24,.09); margin:0 9px 11px;"></div>

      <div style="padding:0 9px 8px;">
        <div style="display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:8px;">
          <span style="font-size:11px; color:#ABA59C;">近 7 天用量</span>
          <span id="miniTotal" style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-weight:600; font-size:17px; letter-spacing:-.01em; color:#1E1C18;">0</span>
        </div>
        <svg id="miniSpark" viewBox="0 0 270 34" style="display:block; width:100%; height:auto; overflow:visible;"></svg>
      </div>

      <div style="height:0.5px; background:rgba(30,28,24,.09); margin:10px 9px;"></div>

      <div id="mbOpen" class="ucb-menu-item" style="display:flex; align-items:center; gap:11px; padding:7px 9px; border-radius:7px; font-size:13px; color:#1E1C18; cursor:pointer;">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="3" width="12" height="10" rx="2"></rect><line x1="2" y1="6" x2="14" y2="6"></line></svg>
        <span style="flex:1;">打开完整窗口</span>
        <span style="opacity:.4; font-size:12px;">⌘O</span>
      </div>
      <div id="mbPrefs" class="ucb-menu-item" style="display:flex; align-items:center; gap:11px; padding:7px 9px; border-radius:7px; font-size:13px; color:#1E1C18; cursor:pointer;">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><line x1="3" y1="5.5" x2="13" y2="5.5"></line><line x1="3" y1="10.5" x2="13" y2="10.5"></line><circle cx="10" cy="5.5" r="1.9" fill="currentColor" stroke="none"></circle><circle cx="6" cy="10.5" r="1.9" fill="currentColor" stroke="none"></circle></svg>
        <span style="flex:1;">偏好设置</span>
        <span style="opacity:.4; font-size:12px;">⌘,</span>
      </div>

      <!-- 点「偏好设置」才展开:胶囊/限额盯哪个工具 -->
      <div id="toolSeg" style="display:none; gap:3px; margin:2px 9px 6px; background:#ECEAE5; border:1px solid rgba(30,28,24,.06); border-radius:9px; padding:3px;">
        <button data-tool="auto" style="flex:1; font:inherit; font-family:inherit; font-size:11.5px; color:#847F76; background:transparent; border:0; border-radius:7px; padding:5px 0; cursor:pointer;">自动</button>
        <button data-tool="claude-code" style="flex:1; font:inherit; font-family:inherit; font-size:11.5px; color:#847F76; background:transparent; border:0; border-radius:7px; padding:5px 0; cursor:pointer;">Claude</button>
        <button data-tool="codex" style="flex:1; font:inherit; font-family:inherit; font-size:11.5px; color:#847F76; background:transparent; border:0; border-radius:7px; padding:5px 0; cursor:pointer;">Codex</button>
      </div>

      <div style="height:0.5px; background:rgba(30,28,24,.09); margin:6px 9px;"></div>
      <div id="mbQuit" class="ucb-menu-item" style="display:flex; align-items:center; gap:11px; padding:7px 9px; border-radius:7px; font-size:13px; color:#1E1C18; cursor:pointer;">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><line x1="8" y1="2.5" x2="8" y2="7.5"></line><path d="M4.8 4.6 A4.6 4.6 0 1 0 11.2 4.6"></path></svg>
        <span style="flex:1;">退出</span>
        <span style="opacity:.4; font-size:12px;">⌘Q</span>
      </div>
    </div>
  </div>

  <!-- ===== 完整窗口 ===== -->
  <div id="fullWindow" style="width:100%; max-width:780px; background:#FFFFFF; border:1px solid rgba(30,28,24,.1); border-radius:16px; overflow:hidden; box-shadow:0 26px 60px -22px rgba(30,28,24,.28), 0 5px 16px -8px rgba(30,28,24,.14);">

    <div class="ucb-faux-titlebar" style="display:flex; align-items:center; gap:9px; padding:13px 16px; border-bottom:1px solid rgba(30,28,24,.08); background:#FBFAF8;">
      <span style="display:flex; gap:8px;">
        <i style="width:11px; height:11px; border-radius:50%; background:#E0655B;"></i>
        <i style="width:11px; height:11px; border-radius:50%; background:#E0B24E;"></i>
        <i style="width:11px; height:11px; border-radius:50%; background:#6FB55E;"></i>
      </span>
      <span style="font-weight:700; margin-left:7px; letter-spacing:.01em;">用量<span style="color:#C2603E;">看板</span></span>
      <span id="updMain" style="margin-left:auto; font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:11px; color:#ABA59C; text-align:right; line-height:1.25; max-width:430px;">本机日志 · 更新 — · 每 60s</span>
    </div>

    <div class="ucb-full-content" style="padding:20px 18px 22px;">

      <!-- 工具分页(全部 / Claude Code / Codex …,由数据动态生成) -->
      <div id="toolTabs" style="display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap;"></div>

      <div id="projectBar" style="display:flex; align-items:center; gap:10px; margin:-4px 0 18px; flex-wrap:wrap;">
        <span class="ucb-section-title-cn">项目</span>
        <div class="ucb-project-picker">
          <input id="projectSearch" class="ucb-project-input" type="search" autocomplete="off" placeholder="搜索项目，默认优先今日和最近活跃">
          <span class="ucb-project-caret">⌄</span>
          <div id="projectSuggest" class="ucb-project-menu"></div>
        </div>
        <span id="projectPath" style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:10.5px; color:#ABA59C; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:430px;"></span>
      </div>

      <!-- HERO -->
      <div style="position:relative; background:#FBFAF8; border:1px solid rgba(30,28,24,.09); border-radius:14px; padding:19px 22px; display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;">
        <div>
          <div id="heroLab" style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:#C2603E; margin-bottom:9px;">近 30 天 · 用量</div>
          <div id="heroBig" style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-weight:600; font-size:56px; line-height:.92; letter-spacing:-.025em; color:#1E1C18; font-feature-settings:'tnum' 1;">0</div>
          <div id="heroSub" style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:12px; color:#847F76; margin-top:11px; letter-spacing:.01em;"></div>
          <div id="heroTrend" style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:11.5px; color:#ABA59C; margin-top:10px; display:none; align-items:center; letter-spacing:.01em;"></div>
          <div id="heroBreak" style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:11.5px; margin-top:13px; display:flex; flex-wrap:wrap; gap:7px 9px; letter-spacing:.01em;"></div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:9px; min-width:min(100%,300px);">
          <div id="periods" class="ucb-range-controls">
            <select id="periodSelect" class="ucb-range-select" aria-label="统计时间范围">
              <option value="today">当天</option>
              <option value="days-2">近 2 天</option>
              <option value="days-3">近 3 天</option>
              <option value="days-4">近 4 天</option>
              <option value="days-5">近 5 天</option>
              <option value="days-6">近 6 天</option>
              <option value="days-7">近 7 天</option>
              <option value="days-14">近 14 天</option>
              <option value="days-30">近 30 天</option>
              <option value="days-90">近 90 天</option>
              <option value="previous-week">上一整周</option>
              <option value="all">全部</option>
              <option value="custom">自定义日期</option>
            </select>
            <span id="timeZoneLab" class="ucb-timezone-label">系统时区</span>
          </div>
          <div id="customPeriod" class="ucb-custom-period">
            <input id="customStart" class="ucb-custom-date" type="date" aria-label="开始日期">
            <span class="ucb-custom-separator">至</span>
            <input id="customEnd" class="ucb-custom-date" type="date" aria-label="结束日期">
          </div>
          <div id="metricSeg" style="display:flex; gap:3px; background:#ECEAE5; border:1px solid rgba(30,28,24,.06); border-radius:10px; padding:3px;">
            <button data-m="tok" style="font:inherit; font-family:inherit; font-size:12.5px; color:#847F76; background:transparent; border:0; border-radius:7px; padding:6px 14px; cursor:pointer;">日志 Token</button>
            <button data-m="usd" data-coral="1" style="font:inherit; font-family:inherit; font-size:12.5px; color:#847F76; background:transparent; border:0; border-radius:7px; padding:6px 14px; cursor:pointer;">美元</button>
          </div>
        </div>
      </div>

      <!-- v0.2 Decision Layer -->
      <div id="decisionStrip" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; margin:14px 0 0;"></div>

      <!-- v0.3 Project Focus -->
      <div id="projectFocus" style="display:none; margin:14px 0 0;"></div>

      <!-- v0.4 Project Monitor -->
      <div style="display:flex; align-items:center; gap:11px; margin:26px 0 13px;">
        <span class="ucb-section-title-cn">项目监控</span><span class="ucb-section-title-en">Project monitor</span>
        <span id="projectMonitorMeta" style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:10.5px; color:#ABA59C;"></span>
        <span style="flex:1; height:1px; background:rgba(30,28,24,.08);"></span>
      </div>
      <div id="projectMonitor" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px;"></div>

      <!-- 今日 Top 项目 -->
      <div style="display:flex; align-items:center; gap:11px; margin:26px 0 13px;">
        <span class="ucb-section-title-cn">今日最高项目</span><span class="ucb-section-title-en">Top project</span>
        <span id="todayProjectDate" style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:10.5px; color:#ABA59C;"></span>
        <span style="flex:1; height:1px; background:rgba(30,28,24,.08);"></span>
      </div>
      <div id="todayProjectRank" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px;"></div>

      <!-- 项目分布 -->
      <div style="display:flex; align-items:center; gap:11px; margin:26px 0 13px;">
        <span class="ucb-section-title-cn">按项目自动用量</span><span class="ucb-section-title-en">Project usage</span>
        <span style="flex:1; height:1px; background:rgba(30,28,24,.08);"></span>
      </div>
      <div id="projectRank" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px;"></div>

      <!-- 实时限额 -->
      <div style="display:flex; align-items:center; gap:11px; margin:26px 0 13px;">
        <span class="ucb-section-title-cn">实时限额</span><span class="ucb-section-title-en">Live limits</span>
        <span style="flex:1; height:1px; background:rgba(30,28,24,.08);"></span>
      </div>
      <div id="limitsGrid" style="display:grid; grid-template-columns:1fr 1fr; gap:14px;"></div>

      <!-- 每日用量 -->
      <div style="display:flex; align-items:center; gap:11px; margin:26px 0 13px;">
        <span class="ucb-section-title-cn">每日用量</span><span class="ucb-section-title-en">Daily usage</span>
        <span style="flex:1; height:1px; background:rgba(30,28,24,.08);"></span>
      </div>
      <div id="dailyUsagePanel" style="background:#FBFAF8; border:1px solid rgba(30,28,24,.08); border-radius:12px; padding:16px 16px 14px;">
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;">
          <div id="viewSeg" style="display:flex; gap:3px; background:#ECEAE5; border:1px solid rgba(30,28,24,.06); border-radius:9px; padding:3px;">
            <button data-v="bar" style="font:inherit; font-family:inherit; font-size:12.5px; color:#847F76; background:transparent; border:0; border-radius:6px; padding:6px 13px; cursor:pointer;">柱状</button>
            <button data-v="line" style="font:inherit; font-family:inherit; font-size:12.5px; color:#847F76; background:transparent; border:0; border-radius:6px; padding:6px 13px; cursor:pointer;">折线</button>
          </div>
          <span id="rangeLab" style="margin-left:auto; font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:11px; color:#ABA59C; letter-spacing:.02em;">近 30 天</span>
        </div>
        <div style="position:relative;">
          <svg id="chart" viewBox="0 0 680 230" style="display:block; width:100%; height:auto; overflow:visible;"></svg>
          <div id="tip" style="position:fixed; pointer-events:none; opacity:0; transform:translateX(-50%); background:#26241F; border:1px solid rgba(255,255,255,.1); border-radius:9px; padding:9px 11px; font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:11px; max-width:min(320px,calc(100vw - 24px)); white-space:normal; box-shadow:0 14px 30px rgba(30,28,24,.35); transition:opacity .09s; z-index:9999;"></div>
        </div>
        <div id="legend" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:15px;"></div>
      </div>

      <!-- 单价 -->
      <div style="display:flex; align-items:center; gap:11px; margin:26px 0 13px;">
        <span class="ucb-section-title-cn">单价</span><span class="ucb-section-title-en">USD / 百万 token</span>
        <span style="flex:1; height:1px; background:rgba(30,28,24,.08);"></span>
      </div>
      <div id="pricing" style="background:#FBFAF8; border:1px solid rgba(30,28,24,.08); border-radius:12px; padding:4px 2px; overflow-x:auto;"></div>

      <!-- 口径说明 -->
      <div id="notice" style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:10.5px; color:#ABA59C; margin:16px auto 0; max-width:720px; text-align:center; line-height:1.45; letter-spacing:.01em;"></div>

    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", async function(){
  var R = document;
  var MONO = "'JetBrains Mono',ui-monospace,Menlo,monospace";
  var $ = function(id){ return R.querySelector('#'+id); };

  // ---- 取真实数据 ----
  var data;
  try {
    var resp = await fetch('/api/usage.json', { cache: 'no-store' });
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    data = await resp.json();
  } catch(e){
    $("heroBig").textContent = "—";
    $("heroSub").innerHTML = '<span style="color:#BE4A33">读取数据失败:'+ (e && e.message) +'。请用 <b>node engine/usage-data.mjs --serve</b> 启动后访问。</span>';
    return;
  }

  // ---- 模型 → 颜色(设计配色 + 兜底)----
  var PALETTE = {
    "opus-4-8":   { color:"#D97757", top:"#E89571" },
    "opus-4-7":   { color:"#D9A441", top:"#E8BC63" },
    "sonnet-4-6": { color:"#7C8FA3", top:"#9AABBC" }
  };
  var FALLBACK = [
    { color:"#A98AD1", top:"#C0A6E0" },
    { color:"#6FA88C", top:"#8DBFA8" },
    { color:"#C77DA0", top:"#D898B8" },
    { color:"#C98A5E", top:"#DBA47C" }
  ];
  // 状态先声明(rebuildModels 要用 st.on)
  var st = { view:"bar", metric:"tok", period:"days-30", customStart:"", customEnd:"", tool:"all", project:"all", on:Object.create(null) };
  var projectQuery = "";
  var projectMenuOpen = false;
  var SECTION_STATE_KEY = "usage-dashboard-section-collapse-v2";
  var sectionState = loadSectionState();

  function loadSectionState(){
    try{
      var raw=JSON.parse(localStorage.getItem(SECTION_STATE_KEY) || "{}");
      return raw && typeof raw==="object" ? raw : {};
    }catch(e){ return {}; }
  }
  function saveSectionState(){
    try{ localStorage.setItem(SECTION_STATE_KEY, JSON.stringify(sectionState)); }catch(e){ console.warn("section state save failed", e); }
  }
  function setupCollapsibleSections(){
    var sections=[
      { id:"projectMonitor", defaultOpen:true },
      { id:"todayProjectRank", defaultOpen:false },
      { id:"projectRank", defaultOpen:false },
      { id:"limitsGrid", defaultOpen:true },
      { id:"dailyUsagePanel", defaultOpen:true },
      { id:"pricing", defaultOpen:false }
    ];
    sections.forEach(function(sec){
      var body=$(sec.id);
      if(!body) return;
      var head=body.previousElementSibling;
      if(!head || head.getAttribute("data-section-ready")==="1") return;
      var openDisplay=body.style.display || "";
      head.setAttribute("data-section-ready","1");
      head.classList.add("ucb-section-toggle");
      head.setAttribute("role","button");
      head.setAttribute("tabindex","0");
      var btn=document.createElement("button");
      btn.type="button";
      btn.className="ucb-section-btn";
      btn.setAttribute("data-section-button", sec.id);
      head.appendChild(btn);

      function apply(collapsed){
        sectionState[sec.id]=!!collapsed;
        body.style.display=collapsed ? "none" : openDisplay;
        head.classList.toggle("is-collapsed", !!collapsed);
        head.classList.toggle("is-expanded", !collapsed);
        btn.textContent="";
        btn.setAttribute("aria-label", collapsed ? "展开" : "收起");
        btn.title=collapsed ? "展开" : "收起";
        head.setAttribute("aria-expanded", collapsed ? "false" : "true");
      }
      var collapsed = sectionState[sec.id];
      if(collapsed===undefined) collapsed = !sec.defaultOpen;
      apply(collapsed);

      function toggle(){
        apply(!sectionState[sec.id]);
        saveSectionState();
      }
      head.addEventListener("click", toggle);
      head.addEventListener("keydown", function(e){
        if(e.key==="Enter" || e.key===" "){ e.preventDefault(); toggle(); }
      });
    });
  }

  // 模型 → 工具 + 配色,封成可重建函数:60s 刷新时新出现的模型也能进来,且保留已有显隐选择
  var toolOf = Object.create(null);
  var MODELS = [];
  var modelSvgIds = Object.create(null);
  function hashText(s){
    var h=2166136261, str=String(s);
    for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
    return (h>>>0).toString(36);
  }
  function safeSvgId(prefix, raw){
    var slug=String(raw).replace(/[^A-Za-z0-9_-]/g,"_").slice(0,32) || "model";
    return prefix+"_"+slug+"_"+hashText(raw);
  }
  function gradId(mid){ return modelSvgIds[mid] || safeSvgId("bg", mid); }
  function hasPalette(id){ return Object.prototype.hasOwnProperty.call(PALETTE, id); }
  function rebuildModels(){
    toolOf = Object.create(null);
    modelSvgIds = Object.create(null);
    (data.daily || []).forEach(function(d){ for(var m in d.byModel){ toolOf[m] = d.byModel[m].tool; } });
    // 兜底色:非设计配色的模型按 id 字母序分配【不同】的 FALLBACK 色 —— 确定性(不随 tok 排序漂移)且互不撞色
    var fbMap = Object.create(null), fbIds = (data.models || []).filter(function(id){ return !hasPalette(id); }).sort();
    fbIds.forEach(function(id, i){ fbMap[id] = FALLBACK[i % FALLBACK.length]; });
    MODELS = (data.models || []).map(function(id){
      var p = hasPalette(id) ? PALETTE[id] : fbMap[id];
      return { id:id, color:p.color, top:p.top, tool: toolOf[id] || "claude-code" };
    });
    MODELS.forEach(function(m){ modelSvgIds[m.id]=safeSvgId("bg", m.id); });
    MODELS.forEach(function(m){ if(st.on[m.id]===undefined) st.on[m.id]=true; }); // 新模型默认显示,不动已有选择
  }
  rebuildModels();

  var PROJECTS = [];
  var projectById = Object.create(null);
  function projectNameFromId(pid){
    if(pid==="unknown") return "未知项目";
    var parts=String(pid).split(/[\\/]/).filter(Boolean);
    return parts.length ? parts[parts.length-1] : String(pid || "项目");
  }
  function projectToolsFromByModel(byModel){
    var tools=Object.create(null);
    Object.keys(byModel||{}).forEach(function(mid){
      var e=byModel[mid] || {};
      tools[e.tool || toolOf[mid] || "claude-code"] = true;
    });
    return Object.keys(tools);
  }
  function mergeProjectTools(a,b){
    var seen=Object.create(null), out=[];
    (a||[]).concat(b||[]).forEach(function(t){ if(t&&!seen[t]){ seen[t]=true; out.push(t); } });
    return out;
  }
  function rebuildProjects(){
    projectById = Object.create(null);
    function ensureProject(id, seed){
      if(!id) return null;
      var cur=projectById[id];
      if(!cur){
        cur={ id:id, name:(seed&&seed.name)||projectNameFromId(id), path:seed&&seed.path||null, tok:0, usd:0, tools:[], lastActiveDate:(seed&&seed.lastActiveDate)||null };
        projectById[id]=cur;
      } else if(seed) {
        cur.name=cur.name || seed.name || projectNameFromId(id);
        cur.path=cur.path || seed.path || null;
        cur.tools=mergeProjectTools(cur.tools, seed.tools);
        if(seed.lastActiveDate && (!cur.lastActiveDate || seed.lastActiveDate > cur.lastActiveDate)) cur.lastActiveDate = seed.lastActiveDate;
      }
      return cur;
    }
    (Array.isArray(data.projects) ? data.projects : []).forEach(function(p){
      if(!p || !p.id) return;
      var cur=ensureProject(p.id, p);
      cur.fallbackTok = Math.max(cur.fallbackTok || 0, p.tok || 0);
      cur.fallbackUsd = Math.max(cur.fallbackUsd || 0, p.usd || 0);
      cur.tools = mergeProjectTools(cur.tools, p.tools);
    });
    (data.daily || []).forEach(function(d){
      Object.keys(d.byProject || {}).forEach(function(pid){
        var entry=d.byProject[pid] || {}, cur=ensureProject(pid);
        cur.tok += entry.tok || 0;
        cur.usd += entry.usd || 0;
        cur.tools = mergeProjectTools(cur.tools, projectToolsFromByModel(entry.byModel));
        if(((entry.tok||0)>0 || (entry.usd||0)>0) && (!cur.lastActiveDate || d.date > cur.lastActiveDate)) cur.lastActiveDate = d.date;
      });
    });
    PROJECTS = Object.keys(projectById).map(function(id){
        var p=projectById[id];
        if((p.tok||0)<=0 && p.fallbackTok) p.tok=p.fallbackTok;
        if((p.usd||0)<=0 && p.fallbackUsd) p.usd=p.fallbackUsd;
        return p;
      })
      .sort(function(a,b){ return (b.tok-a.tok) || (b.usd-a.usd) || String(a.name).localeCompare(String(b.name)); });
    if(st.project!=="all" && !projectById[st.project]) st.project="all";
  }
  rebuildProjects();

  // ---- 日序列:date → label "MM/DD";引擎已补齐连续天与各模型键 ----
  var days = (data.daily || []).map(function(d){
    return { label: d.date.slice(5).replace("-","/"), date: d.date, byModel: d.byModel || {}, byProject: d.byProject || {} };
  });

  var ZB = { input:0, output:0, cacheWrite:0, cacheRead:0 };
  function byModelForDay(d, projectId){
    if(!projectId || projectId==="all") return d.byModel || {};
    var p=d.byProject && d.byProject[projectId];
    return p && p.byModel ? p.byModel : {};
  }
  function cellForProject(d, mid, projectId){ var e = byModelForDay(d, projectId)[mid]; return e ? e : { tok:0, usd:0, tokBreakdown:ZB, usdBreakdown:ZB }; }
  function cell(d, mid){ return cellForProject(d, mid, st.project); }
  function projectHasModel(mid){
    if(st.project==="all") return true;
    return days.some(function(d){
      var e=cellForProject(d, mid, st.project);
      return e && ((e.tok||0)>0 || (e.usd||0)>0);
    });
  }
  function modelDisplayName(id){
    if(id==="gpt-5.6-sol") return "GPT-5.6 Sol";
    if(id==="gpt-5.6-terra") return "GPT-5.6 Terra";
    if(id==="gpt-5.6-luna") return "GPT-5.6 Luna";
    if(id==="codex-unknown") return "未识别模型";
    return id;
  }
  function modelTitle(id){
    if(id==="codex-unknown") return "本机日志没有提供可靠模型名；计入总量，但不列入模型明细";
    return id;
  }
  function projectSearchText(p){
    return [p.id, p.name, p.path, (p.tools||[]).join(" ")].filter(Boolean).join(" ").toLowerCase();
  }
  function projectCurrentScore(p){
    var today=days.length ? metricValue(summarizeProjectRange(p.id, days.slice(-1))) : 0;
    var seven=metricValue(summarizeProjectRange(p.id, days.slice(-7)));
    var last=p.lastActiveDate ? Date.parse(p.lastActiveDate+"T00:00:00") : 0;
    return { today:today, seven:seven, last:last, total:today*1000000 + seven*1000 + (last||0)/1e8 + (st.project===p.id?1e15:0) };
  }
  function projectRowsByCurrent(){
    return PROJECTS.map(function(p){ return { project:p, score:projectCurrentScore(p) }; })
      .sort(function(a,b){ return (b.score.total-a.score.total) || (b.project.tok-a.project.tok) || String(a.project.name).localeCompare(String(b.project.name)); });
  }

  // 当前工具筛选下可见的模型
  function viz(){ return st.tool==="all" ? MODELS : MODELS.filter(function(m){ return m.tool===st.tool; }); }
  function isIdentifiedModel(m){ return m && m.id!=="codex-unknown"; }
  function modelHasUsageInSlice(m, slice){
    return (slice||[]).some(function(d){ return (cell(d,m.id).tok||0)>0; });
  }
  function usedIdentifiedModels(slice){
    return viz().filter(function(m){ return isIdentifiedModel(m) && modelHasUsageInSlice(m,slice); });
  }
  function hasReadableCacheWrite(m){
    var p=(data.pricing||{})[m.id];
    return !!p && p.cacheWrite1h!=null && p.cacheWrite5m!=null;
  }

  function fmtUSD(v){ if(v>=1000) return "$"+(v/1000).toFixed(1)+"k"; return "$"+(v<10?v.toFixed(1):Math.round(v)); }
  function fmtUSDbig(v){ return v.toLocaleString("en-US",{maximumFractionDigits:0}); }
  function fmtTok(v){ if(v>=1e12) return (v/1e12).toFixed(1)+"T"; if(v>=1e9) return (v/1e9).toFixed(1)+"B"; if(v>=1e6) return (v/1e6).toFixed(1)+"M"; if(v>=1e3) return (v/1e3).toFixed(0)+"k"; return Math.round(v)+""; }
  function fmtShare(v){ return v==null ? "—" : Math.round(v*100)+"%"; }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
  function clockMDHM(iso){
    if(!iso) return "—";
    var d=new Date(iso);
    if(isNaN(d)) return "—";
    return ('0'+(d.getMonth()+1)).slice(-2)+'/'+('0'+d.getDate()).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  }
  function sourceSummary(){
    var srcs=(data._meta&&data._meta.sources)||[];
    var parts=[];
    srcs.forEach(function(s){
      if(!s || !s.tool) return;
      if(s.tool==="codex") parts.push("Codex ~/.codex/sessions");
      else if(s.tool==="claude-code") parts.push("Claude ~/.claude/projects");
      else parts.push(toolLabel(s.tool)+" 本机日志");
    });
    return parts.length ? parts.join(" · ") : "本机日志";
  }
  function tokenScopeText(){
    return "本机日志 Token（含 Cache Read），不是 Codex Profile / 额度口径，不可一一对账";
  }
  function sourceScopeText(){
    return "来源 "+sourceSummary()+" · 数据更新时间 "+clockMDHM(data.updatedAt);
  }
  var MS_HOUR = 3600000;
  function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
  function finiteNumber(v){ var n=Number(v); return isFinite(n) ? n : null; }
  function zeroBreak(){ return { input:0, output:0, cacheWrite:0, cacheRead:0 }; }
  function addBreak(target, src){
    src = src || ZB;
    target.input += src.input || 0;
    target.output += src.output || 0;
    target.cacheWrite += src.cacheWrite || 0;
    target.cacheRead += src.cacheRead || 0;
  }
  function freshTokOf(b){ return (b.input||0) + (b.output||0) + (b.cacheWrite||0); }
  function totalBreak(b){ return (b.input||0) + (b.output||0) + (b.cacheWrite||0) + (b.cacheRead||0); }
  function fmtDurationHours(hours){
    if(hours==null || !isFinite(hours)) return "";
    if(hours < 1) return Math.max(1, Math.round(hours*60))+"m";
    if(hours < 24){
      var h=Math.floor(hours), m=Math.round((hours-h)*60);
      if(m===60){ h+=1; m=0; }
      return h+"h"+(m ? " "+m+"m" : "");
    }
    return Math.round(hours/24)+" 天";
  }
  function visibleToolList(toolFilter){
    if(toolFilter && toolFilter!=="all" && toolFilter!=="auto") return [toolFilter];
    var ts=(data.tools||[]).slice();
    if(!ts.length) ts=Object.keys(data.limits||{});
    return ts;
  }
  function windowMeta(win){
    return win==="sevenDay" ? { hours:168, short:"7天额度", label:"7 天额度" } : { hours:5, short:"5小时额度", label:"5 小时额度" };
  }
  function unknownForecast(tool, win, reason){
    var meta=windowMeta(win);
    return { tool:tool||"", win:win, winShort:meta.short, winLabel:meta.label, status:"unknown", pctUsed:null, etaHours:null, willExhaustBeforeReset:false, text:reason||"限额数据不足，无法预测", basisLabel:"数据不足", pctPerHour:null, freshness:"unknown" };

  function fmtRemain(iso){
    if(!iso) return ""; var d=new Date(iso); if(isNaN(d)) return "";
    var ms=d-new Date(); if(ms<=0) return "即将重置";
    var h=ms/3600000;
    if(h<24){ var hh=Math.floor(h), mm=Math.round((h-hh)*60); return "还剩 "+(hh>0?hh+"h ":"")+mm+"m 重置"; }
    return "还剩 "+Math.round(h/24)+" 天 重置";

    var best=null, L=data.limits||{};

      var x=L[t]&&L[t][win]; if(x&&x.pct!=null&&(best===null||x.pct>best.pct)) best={pct:x.pct,resetAt:x.resetAt};

    return best;
  }

    $("updPop").textContent="日志 "+hhmm;
    var mb=$("mbSource");
    if(mb) mb.textContent="本机日志 Token · 非 Profile / 额度口径 · 更新 "+hhmm;
  }

  // ---- 初始化 ----
  setActive($("metricSeg"), $("metricSeg").querySelector('[data-m="tok"]'));
  setActive($("viewSeg"), $("viewSeg").querySelector('[data-v="bar"]'));

  renderPillPop();
  applyUpdatedAt(data.updatedAt);
  $("notice").textContent = tokenScopeText()+" · "+sourceScopeText()+((data.notice||"") ? " · "+data.notice : "");

  renderToolTabs();
  renderMini();
  renderAll();
  setupCollapsibleSections();

  // ---- 每 60s 静默刷新数据(与引擎重算节奏一致)----
  setInterval(async function(){
    try{
      var r = await fetch('/api/usage.json',{cache:'no-store'}); if(!r.ok){ console.warn("usage refresh failed", r.status); return; }
      var nd = await r.json();
      data = nd;
      days = (nd.daily||[]).map(function(d){ return { label:d.date.slice(5).replace("-","/"), date:d.date, byModel:d.byModel||{}, byProject:d.byProject||{} }; });
      rebuildModels(); // 新模型 / tool 变化也跟上,保留显隐选择
      rebuildProjects();
      renderPillPop(); applyUpdatedAt(nd.updatedAt); $("notice").textContent=tokenScopeText()+" · "+sourceScopeText()+((nd.notice||"") ? " · "+nd.notice : "");
      renderToolTabs(); renderMini(); renderAll();
    }catch(e){
      console.warn("usage refresh failed", e);
    }
  }, 60000);
});
</script>
</body>
</html>
